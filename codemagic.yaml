workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Build Android APK
        script: |
          flutter build apk --release -t lib/main.dart
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
